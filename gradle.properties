// 本机环境隔离说明（重要）
//
// 本机同时存在其它 Android 工程，为避免互相影响，
// 本工程刻意 **不设置** 以下内容：
//
//   - org.gradle.java.home      → 沿用系统默认 JDK（Zulu 21），不锁定 JDK 路径
//   - ANDROID_HOME / ANDROID_SDK_ROOT 环境变量 → 只在本工程 local.properties 里写 sdk.dir
//   - ~/.gradle/gradle.properties 与 ~/.gradle/init.d/** → 一律不写入
//   - 共享的 Android SDK 目录 → 只读取，不安装/不删除任何组件
//
// 因此本工程对其它项目是只读的：只会共用 ~/.gradle 的依赖缓存（内容是版本隔离的，追加式写入）。
//
// 如果确实需要完全隔离的依赖缓存（例如做一次性验证），可以临时用：
//   GRADLE_USER_HOME=./.gradle-home ./gradlew ...
// 代价是首次构建要重新下载全部依赖。

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official